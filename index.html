<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placeholder</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --rule: #e4e4e4;
    --link: #2b5fd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --rule: #2c2c2c;
      --link: #7aa2f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 42rem;
    margin: 0 auto;
    padding: 5rem 1.5rem;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  .tagline { color: var(--muted); margin: 0 0 2.5rem; }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 2.5rem 0 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }
  ul { padding-left: 1.1rem; margin: 0; }
  li { margin: 0.4rem 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.875rem;
  }
</style>
</head>
<body>
<main>
  <h1>Placeholder</h1>
  <p class="tagline">Site under construction.</p>

  <h2>Writing</h2>
  <ul>
    <li>Nothing here yet.</li>
  </ul>

  <h2>Elsewhere</h2>
  <ul>
    <li><a href="https://github.com/OrenNeumann">GitHub</a></li>
  </ul>

  <footer>
    Replace this file, or delete it and drop in a static site generator.
  </footer>
</main>
</body>
</html>
